<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 텍톤 티아크(T-ARCH)</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{--ink:#101619;--green:#46FF16;--t2:#C9D0CC;--t3:#9AA39F;--line:rgba(243,246,244,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--ink);color:#F3F6F4;word-break:keep-all;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header{padding:22px clamp(20px,5vw,64px);border-bottom:1px solid var(--line)}
  .lockup{display:inline-flex;align-items:center;gap:14px;text-decoration:none}
  .lockup img{height:22px;width:auto}.lockup span{width:1px;height:20px;background:rgba(255,255,255,.3)}
  main{flex:1;display:flex;align-items:center;padding:64px clamp(20px,5vw,64px)}
  .box{max-width:720px}
  .code{font:500 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--t3);display:flex;align-items:center;gap:10px}
  .code i{width:8px;height:8px;background:var(--green)}
  h1{margin-top:22px;font-size:clamp(32px,4.4vw,56px);line-height:1.18;letter-spacing:-.03em;font-weight:800}
  h1 em{font-style:normal;color:var(--green)}
  p{margin-top:20px;font-size:clamp(16px,1.3vw,19px);line-height:1.7;color:var(--t2);max-width:560px}
  .btns{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;padding:16px 24px;font-weight:700;font-size:16px;text-decoration:none;border-radius:2px}
  .btn.p{background:var(--green);color:var(--ink)}.btn.g{border:1px solid rgba(255,255,255,.4);color:#fff}
  footer{padding:20px clamp(20px,5vw,64px);border-top:1px solid var(--line);font-size:13px;color:var(--t3)}
  footer a{color:var(--t2)}
</style>
</head>
<body>
<header><a class="lockup" href="/" aria-label="텍톤 홈"><img src="/static/v2/TEKTON_clean_white.svg" alt="TEKTON 텍톤"><span></span><img src="/static/v2/T-ARCH_clean_white.svg" alt="T-ARCH 티아크"></a></header>
<main><div class="box">
  <div class="code"><i></i>404 · NOT FOUND</div>
  <h1>찾으시는 페이지가 없습니다.<br><em>홈에서</em> 다시 시작해 주세요.</h1>
  <p>주소가 바뀌었거나 더 이상 제공하지 않는 페이지입니다. 티아크(T-ARCH)는 기존 중앙감시·자동제어에 읽기 전용으로 연결해 건물 설비의 이상·낭비·고장 징후를 근거와 함께 알려드립니다.</p>
  <div class="btns"><a class="btn p" href="/">홈으로 →</a><a class="btn g" href="/#start">우리 건물 7일 진단 신청</a></div>
</div></main>
<footer>텍톤(TEKTON) · <a href="mailto:rok@tekton.co.kr">rok@tekton.co.kr</a></footer>
</body>
</html>
